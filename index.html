<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skill Forward | Your Dream Starts Here</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
      color: #172033;

      /* Light Skill Forward brand background */
      background:
        radial-gradient(circle at 15% 15%, rgba(91, 79, 207, 0.18), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(55, 145, 225, 0.18), transparent 30%),
        linear-gradient(135deg, #f7f8ff 0%, #eef5ff 100%);
    }

    /* Decorative brand circles */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      z-index: -1;
      filter: blur(2px);
    }

    body::before {
      width: 220px;
      height: 220px;
      background: rgba(91, 79, 207, 0.08);
      top: -80px;
      right: -70px;
    }

    body::after {
      width: 180px;
      height: 180px;
      background: rgba(54, 145, 225, 0.08);
      bottom: -70px;
      left: -60px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    /* Logo */
    .logo {
      width: 105px;
      height: 105px;
      object-fit: contain;
      background: white;
      border-radius: 28px;
      padding: 14px;
      box-shadow: 0 12px 35px rgba(50, 70, 140, 0.12);
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
      color: #171c3a;
    }

    .tagline {
      font-size: 15px;
      font-weight: 500;
      color: #626b83;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #20263d;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(104, 112, 170, 0.10);
      border-radius: 17px;
      padding: 14px 17px;
      min-height: 64px;

      box-shadow: 0 8px 25px rgba(45, 64, 125, 0.08);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: white;
      box-shadow: 0 12px 30px rgba(45, 64, 125, 0.13);
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 13px;
      flex-shrink: 0;

      background: linear-gradient(
        135deg,
        rgba(91, 79, 207, 0.12),
        rgba(55, 145, 225, 0.12)
      );

      color: #514bc4;
    }

    .icon svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .link-text {
      text-align: left;
      flex: 1;
    }

    .link-title {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .link-subtitle {
      display: block;
      font-size: 12px;
      color: #8991a6;
    }

    .arrow {
      font-size: 21px;
      color: #a3a9ba;
      margin-left: 8px;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #8b92a5;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 25px;
      }

      .link {
        min-height: 61px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Skill Forward Logo -->
    <img src="logo.png" alt="Skill Forward Logo" class="logo">

    <!-- Company Name -->

    <div class="footer">

  </main>

</body>
</html>
